<title>Decision docket — tabbed artifact template</title>

<style>
  /* ============================================================
     PALETTE AND TYPE TOKENS
     Every colour below is a token. Components style themselves
     through the tokens, so the three theme blocks are the only
     place a colour is ever written down.
     ============================================================ */
  :root {
    --ink:        #141A1F;
    --ink-soft:   #30383F;
    --ink-faint:  #42484E;
    --paper:      #E8EAE6;
    --surface:    #F5F6F3;
    --rail:       #DEE1DB;
    --rule:       #C7CBC4;
    --rule-soft:  #DBDED8;
    --accent:     #1D4E6B;
    --accent-ink: #14384E;
    --good:       #3D6C48;
    --warn:       #96631C;
    --risk:       #8F3119;
    --good-wash:  #DEE9E0;
    --warn-wash:  #F2E7D1;
    --risk-wash:  #F2DED7;
    --accent-wash:#DAE4EA;

    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
    --s5: 24px; --s6: 32px; --s7: 44px;
    --measure: 66ch;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DFE4E2; --ink-soft: #B8C0C5; --ink-faint: #A2AAAF;
      --paper: #0F141A; --surface: #181F26; --rail: #141A20;
      --rule: #2D3740; --rule-soft: #222A32;
      --accent: #82B5D1; --accent-ink: #A9CEE3;
      --good: #83B48F; --warn: #D6A863; --risk: #D9866F;
      --good-wash: #1C2A21; --warn-wash: #2B2417; --risk-wash: #2E1E18;
      --accent-wash: #16272F;
    }
  }
  :root[data-theme="dark"] {
    --ink: #DFE4E2; --ink-soft: #B8C0C5; --ink-faint: #A2AAAF;
    --paper: #0F141A; --surface: #181F26; --rail: #141A20;
    --rule: #2D3740; --rule-soft: #222A32;
    --accent: #82B5D1; --accent-ink: #A9CEE3;
    --good: #83B48F; --warn: #D6A863; --risk: #D9866F;
    --good-wash: #1C2A21; --warn-wash: #2B2417; --risk-wash: #2E1E18;
    --accent-wash: #16272F;
  }
  :root[data-theme="light"] {
    --ink: #141A1F; --ink-soft: #30383F; --ink-faint: #42484E;
    --paper: #E8EAE6; --surface: #F5F6F3; --rail: #DEE1DB;
    --rule: #C7CBC4; --rule-soft: #DBDED8;
    --accent: #1D4E6B; --accent-ink: #14384E;
    --good: #3D6C48; --warn: #96631C; --risk: #8F3119;
    --good-wash: #DEE9E0; --warn-wash: #F2E7D1; --risk-wash: #F2DED7;
    --accent-wash: #DAE4EA;
  }

  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 1180px; margin: 0 auto; padding: var(--s6) var(--s5) var(--s7); }

  /* ---------- masthead ---------- */
  .masthead { display: flex; flex-direction: column; gap: var(--s3); margin-bottom: var(--s5); }
  .topline {
    font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  h1 {
    font-family: var(--serif); font-size: clamp(27px, 4vw, 38px); line-height: 1.1;
    font-weight: 600; letter-spacing: -0.015em; margin: 0; text-wrap: balance;
  }
  .intro {
    font-family: var(--serif); font-size: 17px; color: var(--ink);
    max-width: var(--measure); margin: 0;
  }

  /* The instruction reads as a sequence: a dot per step, a hairline
     between them doing the counting. */
  .stepper { display: flex; align-items: center; flex-wrap: wrap; gap: 0; }
  .step { display: flex; align-items: center; gap: var(--s2); }
  .step span { font-size: 15px; color: var(--ink); }
  .step u {
    text-decoration: none; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); flex: 0 0 8px;
  }
  .step-link { width: 34px; height: 1px; background: var(--rule); margin: 0 var(--s3); }

  .figures { display: flex; flex-wrap: wrap; gap: var(--s5); margin-top: var(--s2); }
  .figures div { display: flex; flex-direction: column; }
  .figures b {
    font-family: var(--serif); font-size: 25px; font-weight: 600;
    line-height: 1.1; font-variant-numeric: tabular-nums;
  }
  .figures span {
    font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--ink-faint);
  }

  /* ---------- layout ---------- */
  .board {
    display: grid; grid-template-columns: 258px minmax(0, 1fr);
    gap: var(--s5); align-items: start;
  }

  /* ---------- tab rail ---------- */
  .tabs {
    display: flex; flex-direction: column;
    background: var(--rail); border: 1px solid var(--rule-soft);
    position: sticky; top: var(--s4); max-height: calc(100vh - 90px); overflow-y: auto;
  }

  .tabs-group {
    font-family: var(--mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint);
    padding: var(--s4) var(--s3) var(--s1);
  }

  .tab {
    display: flex; align-items: center; gap: var(--s2);
    padding: 9px var(--s3); border: 0; background: transparent;
    font-family: var(--sans); font-size: 14px; line-height: 1.35;
    color: var(--ink-soft); text-align: left; width: 100%; cursor: pointer;
    border-left: 3px solid transparent;
    text-transform: none; letter-spacing: normal;
  }
  .tab:hover { background: var(--surface); color: var(--ink); }
  .tab[aria-selected="true"] {
    background: var(--surface); color: var(--ink);
    border-left-color: var(--accent); font-weight: 600;
  }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .dot {
    width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px;
    background: var(--rule); margin-top: 6px; align-self: flex-start;
  }
  .tab[data-state="done"] .dot { background: var(--good); }
  .tab[data-state="urgent"] .dot { background: var(--risk); }
  .tab-label { flex: 1; }

  /* ---------- panel ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--rule-soft);
    padding: var(--s5) var(--s6) var(--s6);
    display: flex; flex-direction: column; gap: var(--s5);
  }
  .panel[hidden] { display: none; }

  .panel-head { display: flex; flex-direction: column; gap: var(--s2); }
  .panel-label {
    font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .panel h2 {
    font-family: var(--serif); font-size: clamp(22px, 3vw, 28px); line-height: 1.15;
    font-weight: 600; margin: 0; letter-spacing: -0.012em; text-wrap: balance;
  }
  .summary { font-size: 17px; color: var(--ink-soft); max-width: var(--measure); margin: 0; }

  .block { display: flex; flex-direction: column; gap: var(--s2); }
  .block h3 {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint); margin: 0; font-weight: 600;
  }
  .block p { margin: 0; max-width: var(--measure); }
  .block p + p { margin-top: var(--s2); }
  .block ul { margin: 0; padding-left: 1.15em; max-width: var(--measure); }
  .block li { margin-bottom: var(--s2); }

  code {
    font-family: var(--mono); font-size: 0.88em;
    background: var(--paper); padding: 1px 5px; border-radius: 2px;
  }

  .callout {
    background: var(--accent-wash); border-left: 3px solid var(--accent);
    padding: var(--s3) var(--s4); max-width: var(--measure);
  }
  .callout.risk { background: var(--risk-wash); border-left-color: var(--risk); }
  .callout.warn { background: var(--warn-wash); border-left-color: var(--warn); }
  .callout.good { background: var(--good-wash); border-left-color: var(--good); }
  .callout p { margin: 0; }
  .callout p + p { margin-top: var(--s2); }

  table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  .scroller { overflow-x: auto; border: 1px solid var(--rule-soft); }
  th, td {
    text-align: left; padding: 7px var(--s3);
    border-bottom: 1px solid var(--rule-soft); vertical-align: top;
  }
  th {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-faint); font-weight: 600;
    background: var(--paper); white-space: nowrap;
  }
  th.num, td.num { text-align: right; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }

  a { color: var(--accent-ink); }
  a:hover { text-decoration: underline; }

  /* ---------- the choice control ---------- */
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--s3); }
  .option {
    border: 1px solid var(--rule); background: var(--paper);
    display: flex; flex-direction: column; position: relative;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .option:hover { border-color: var(--accent); }
  .option input {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; width: 100%; height: 100%;
  }
  .option-inner { padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s1); pointer-events: none; }
  .option-flag {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--paper); background: var(--accent);
    align-self: flex-start; padding: 2px 6px; margin-bottom: var(--s1);
  }
  .option-title { font-weight: 600; font-size: 15px; }
  .option-detail { font-size: 13.5px; color: var(--ink-soft); line-height: 1.45; }
  .option input:checked ~ .option-inner { color: var(--ink); }
  .option:has(input:checked) { border-color: var(--accent); border-width: 2px; background: var(--accent-wash); }
  .option:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

  textarea {
    font-family: var(--sans); font-size: 15px; line-height: 1.55; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule);
    padding: var(--s3); width: 100%; min-height: 92px; resize: vertical;
  }
  textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea::placeholder { color: var(--ink-faint); }

  .navrow { display: flex; gap: var(--s2); border-top: 1px solid var(--rule-soft); padding-top: var(--s4); }
  .navrow .spacer { flex: 1; }

  button {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.07em;
    text-transform: uppercase; padding: 9px 16px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--paper);
  }
  button:hover { opacity: 0.87; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.ghost { background: transparent; color: var(--accent-ink); border-color: var(--rule); }
  button:disabled { opacity: 0.4; cursor: default; }

  .dock {
    margin-top: var(--s5); background: var(--surface);
    border: 1px solid var(--rule-soft); border-top: 2px solid var(--ink);
    padding: var(--s3) var(--s5); display: flex; flex-wrap: wrap;
    align-items: center; gap: var(--s4);
  }
  .dock-status { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .dock-actions { display: flex; gap: var(--s2); margin-left: auto; }

  .out {
    font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
    background: var(--surface); border: 1px solid var(--rule);
    padding: var(--s4); margin-top: var(--s3); white-space: pre-wrap;
    word-break: break-word; max-height: 320px; overflow-y: auto;
  }
  .hidden { display: none; }

  footer { margin-top: var(--s5); font-size: 13.5px; color: var(--ink-faint); max-width: var(--measure); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 860px) {
    /* minmax(0, 1fr) caps the track at the available width. An auto-sized
       track grows to fit the widest tab and pushes the page sideways. */
    .board { grid-template-columns: minmax(0, 1fr); }
    .tabs { position: static; max-height: none; flex-direction: row; overflow-x: auto; min-width: 0; }
    .tabs-group { display: none; }
    .tab { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; width: auto; }
    .tab[aria-selected="true"] { border-left: 0; border-bottom-color: var(--accent); }
    .stepper { flex-direction: column; align-items: flex-start; gap: var(--s2); }
    .step-link { display: none; }
    .panel { padding: var(--s5) var(--s4); }
    .shell { padding: var(--s5) var(--s4) var(--s6); }
  }
</style>

<div class="shell">
  <header class="masthead" id="masthead"></header>

  <div class="board">
    <nav class="tabs" role="tablist" aria-label="Decisions"></nav>
    <div id="panels"></div>
  </div>

  <div class="dock">
    <span class="dock-status" id="status"></span>
    <div class="dock-actions">
      <button class="ghost" id="clear">Clear all</button>
      <button id="copy">Copy my decisions</button>
    </div>
  </div>
  <div class="out hidden" id="out"></div>

  <footer id="footnote"></footer>
</div>

<script>
/* ================================================================
   SECTION 1 — CONFIG
   Everything above the tabs, plus the page's own wiring.
   ================================================================ */
var CONFIG = {
  /* Small mono line above the headline. Date it, or name the source. */
  topline: "Writing standard &middot; decision docket",

  /* The headline. Say what the reader is being asked for. */
  title: "How to write a docket somebody can answer",

  /* One paragraph telling the reader how the page works. */
  intro: "Each tab states one rule, and follows it.",

  /* What the reader does, one step per entry. Rendered as a stepper
     under the intro. An empty list hides it. */
  steps: ["Read a tab", "Pick a direction", "Add a note"],

  /* Headline figures. Use an empty list to hide this row entirely.
     Keep these in step with the tabs: the dock counts only the items
     that carry a choice, so a "decisions on this page" figure that
     disagrees with it is the first thing a reader notices. */
  figures: [
    {value: "1",  label: "Decision per tab"},
    {value: "1",  label: "Source per claim"},
    {value: "20", label: "Words per sentence, max"},
    {value: "3",  label: "Decisions on this page"}
  ],

  /* Small print under the dock. Say where the numbers came from and
     where the reader's answers live. */
  footnote: "Replace these tabs with your own. Your answers stay in this browser until you press copy.",

  /* Heading on the text the copy button produces. */
  copyHeading: "## My decisions",

  /* Browser storage key. Give each docket its own, so two dockets
     open in the same browser never overwrite each other. */
  storageKey: "decision-docket-standard-v1"
};

/* ================================================================
   SECTION 2 — CONTENT
   One entry per tab, in the order the reader should meet them.

   ITEM FIELDS
     id          Short slug. Must be unique. Used for storage and anchors.
     group       Rail heading. Consecutive items sharing a group sit under
                 one heading. Suggested set:
                   "Read this first"  — context the rest depends on
                   "Only you can answer" — genuine judgement calls
                   "Ready when you say go" — decided in principle, awaiting a yes
                   "Reference" — background, no decision
     tab          Rail label. Short enough to read at a glance.
     urgent       true paints the rail dot red. On an item with choices the
                  dot turns green once answered. On a reading-only item it
                  stays red, marking a tab that always wants attention.
     readingOnly  true makes it a reading-only tab: choices and the note box
                  stay off, and the "N of M decided" count skips it. An item
                  carrying no options list reads the same way.
     label        Mono line above the panel heading. Scope, owner, or state.
     title        Panel heading. A full sentence beats a label.
     summary      One paragraph. The whole situation in plain words.
     blocks       List of body blocks (below).
     options      List of choices (below). Reading-only items leave it off.

   BODY BLOCKS — three kinds, mix freely, any order
     {heading: "Heading", paragraphs: ["Paragraph.", "Another."]}
     {heading: "Heading", bullets: ["Point.", "Another point."]}
     {heading: "Heading", table: {head: ["Col", "Col"], rows: [["a","b"]]}}
     {callout: "", paragraphs: ["..."]}        tone: "" | "good" | "warn" | "risk"

   OPTION FIELDS
     decision     The sentence written into the copied output. Write it in
                  the reader's voice, first person: "Bring everything up to
                  date first".
     title        Card title. Two or three words.
     detail       Where the path goes, and what it costs.
     recommended  true puts a Recommended flag on the card. At most one.

   NOTES ON WRITING
     - Text is placed as HTML. Use <strong>, <em>, <code>, and entities
       such as &mdash; and &ldquo;. The author of the docket writes every
       string, so the page places them as written.
     - Give full context in the tab. A reference number with a link is not
       context; say what the thing is and why it matters.
     - Name things the way the reader names them, not the way the system
       is built.
     - A table column whose cells all read as numbers is right-aligned and
       set in tabular figures automatically.
     - A link carrying data-tab jumps to another tab: <a href="#"
       data-tab="blocks">the blocks</a>.
     - Every claim in a tab carries a source you checked. Flag a claim you
       cannot check as unchecked, in the tab, or leave it out.
     - State a claim by naming what the thing is, and state guidance as the
       action to take. Reserve naming what to avoid for behaviour you can
       pin down only by its failure.
     - Draw a picture whenever the reader would otherwise hold several
       numbers at once, and put the measurements beside it.

   The items below state the standard for writing a tab, and follow it.
   Read them once, then replace them with your own decisions.
   ================================================================ */
var ITEMS = [

  {
    id: "evidence", group: "Read this first", urgent: true, readingOnly: true,
    tab: "Every claim carries a source",
    label: "The rule that outranks the rest",
    title: "Check it, or leave it out",
    summary: "A sentence nobody checked gets acted on all the same.",
    blocks: [
      {heading: "Checked means", bullets: [
        "A command you ran, and its output.",
        "A file you opened, named by path.",
        "A page you read, named by title."
      ]},
      {heading: "Keep these out", table: {
        head: ["Keep out", "Write this"],
        rows: [
          ["A branching guess", "Check which case holds. Write that one."],
          ["An unconfirmed problem", "Reproduce it, or drop the tab."],
          ["A softened claim", "Say what happens, or say you do not know."],
          ["A vague number", "The count, and the command behind it."]
        ]
      }},
      {heading: "Cannot reach a source", bullets: [
        "Say so in the tab.",
        "Name what you could not reach."
      ]},
      {heading: "Before it ships", bullets: [
        "A second pass checks every claim against its source.",
        "Anything unconfirmed comes out, or ships flagged."
      ]},
      {callout: "risk", paragraphs: [
        "<strong>Write only what you checked. Name the source, or name the gap. Fix only a problem you reproduced.</strong>"
      ]}
    ]
  },

  {
    id: "self-contained", group: "Read this first", urgent: true, readingOnly: true,
    tab: "Every tab carries its own context",
    label: "The reason this format exists",
    title: "A reference number is not context",
    summary: "The reader answers from the tab alone.",
    blocks: [
      {heading: "Each tab says", bullets: [
        "What the thing is.",
        "What it does today.",
        "What happens if it lands.",
        "What it costs."
      ]},
      {heading: "Name it the reader&rsquo;s way", table: {
        head: ["Built the system&rsquo;s way", "Named the reader&rsquo;s way"],
        rows: [
          ["The pytest collection root", "The test suite"],
          ["The notification webhook", "Appointment reminders"],
          ["The pre-commit AST gate", "The check before a commit"]
        ]
      }},
      {heading: "Write for a stranger", bullets: [
        "Assume no knowledge of the system.",
        "Anything they would look up belongs in the tab."
      ]},
      {callout: "", paragraphs: [
        "Full tabs live in <a href=\"#\" data-tab=\"worked\">Four worked tabs</a>."
      ]}
    ]
  },

  {
    id: "grouping", group: "Only you can answer", urgent: true,
    tab: "How to group your tabs",
    label: "The rail headings",
    title: "Groups say what each tab asks of the reader",
    summary: "Consecutive tabs sharing a group sit under one heading.",
    blocks: [
      {heading: "The four groups", table: {
        head: ["Group", "Holds", "Reader does"],
        rows: [
          ["Read this first", "Context the rest depends on", "Reads"],
          ["Only you can answer", "Judgement calls", "Picks a path"],
          ["Ready when you say go", "Decided in principle", "Says yes"],
          ["Reference", "Background and examples", "Consults"]
        ]
      }},
      {heading: "Order", bullets: [
        "Most demanding first.",
        "A reader who stops halfway has still answered what only they could."
      ]},
      {callout: "", paragraphs: [
        "One example per group in <a href=\"#\" data-tab=\"worked\">Four worked tabs</a>."
      ]}
    ],
    options: [
      {recommended: true, decision: "Use the four suggested groups", title: "The four groups", detail: "Sorts by what each tab asks. Works for any subject."},
      {decision: "Group by subject area", title: "By subject", detail: "Fits a one-system docket. Drops the urgency signal."},
      {decision: "One flat list, no groups", title: "No groups", detail: "Fits a short rail. A long one loses its scan."}
    ]
  },

  {
    id: "choices", group: "Only you can answer",
    tab: "How to write the choices",
    label: "The cards under &ldquo;Your call&rdquo;",
    title: "Every card names its cost",
    summary: "A card says where the path goes, and what it costs to walk it.",
    blocks: [
      {heading: "The fields", table: {
        head: ["Field", "Holds"],
        rows: [
          ["<code>decision</code>", "The sentence copied out. First person."],
          ["<code>title</code>", "Two or three words."],
          ["<code>detail</code>", "Where it goes, and what it costs."],
          ["<code>recommended</code>", "A flag on the card. At most one."]
        ]
      }},
      {heading: "Cost is what the reader gives up", bullets: [
        "Time.",
        "Rework.",
        "Work left undone.",
        "A risk carried."
      ]},
      {heading: "Half a card, and a whole one", table: {
        head: ["Card", "Half", "Whole"],
        rows: [
          ["Update everything first", "Cleanest result.", "Cleanest result. Two days of nothing else."],
          ["Fix it properly", "The durable answer.", "The durable answer. Touches both systems."],
          ["Leave it", "No work now.", "No work now. The next person loses the same afternoon."]
        ]
      }},

/* ================================================================
   SECTION 3 — ENGINE
   Renders the page and stores the reader's answers. No edits needed
   here to fill the template in.
   ================================================================ */
(function () {
  var state = {};
  try { state = JSON.parse(localStorage.getItem(CONFIG.storageKey) || "{}"); } catch (e) { state = {}; }

  /* An item is decidable when it actually renders choices. Deriving the
     dock count from the same test the renderer uses keeps the denominator
     honest when an item carries no options. */
  function hasChoices(item) {
    return !item.readingOnly && !!(item.options && item.options.length);
  }
  var decidable = ITEMS.filter(hasChoices);
  var tabsEl = document.querySelector(".tabs");
  var panelsEl = document.getElementById("panels");

  /* ---------- masthead ---------- */
  (function renderMasthead() {
    var html = '<div class="topline">' + CONFIG.topline + "</div>" +
      "<h1>" + CONFIG.title + "</h1>" +
      '<p class="intro">' + CONFIG.intro + "</p>";
    if ((CONFIG.steps || []).length) {
      html += '<div class="stepper">';
      CONFIG.steps.forEach(function (step, index) {
        if (index) { html += '<span class="step-link"></span>'; }
        html += '<span class="step"><u></u><span>' + step + "</span></span>";
      });
      html += "</div>";
    }
    if ((CONFIG.figures || []).length) {
      html += '<div class="figures">';
      CONFIG.figures.forEach(function (f) {
        html += "<div><b>" + f.value + "</b><span>" + f.label + "</span></div>";
      });
      html += "</div>";
    }
    document.getElementById("masthead").innerHTML = html;
    document.getElementById("footnote").innerHTML = CONFIG.footnote;
  })();

  /* ---------- body blocks ---------- */
  function renderTable(t) {
    /* A column is numeric when every cell in it is digits, spaces, commas,
       percent signs, or currency. Numeric columns align right in tabular
       figures so they can be compared down the column. */
    var numeric = t.head.map(function (h, col) {
      return t.rows.every(function (r) { return /^[\d,.\s%£$€+-]+$/.test(String(r[col] || "")); });
    });
    var html = '<div class="scroller"><table><thead><tr>';
    t.head.forEach(function (h, i) {
      html += "<th" + (numeric[i] ? ' class="num"' : "") + ">" + h + "</th>";
    });
    html += "</tr></thead><tbody>";
    t.rows.forEach(function (r) {
      html += "<tr>";
      r.forEach(function (c, i) { html += "<td" + (numeric[i] ? ' class="num"' : "") + ">" + c + "</td>"; });
      html += "</tr>";
    });
    return html + "</tbody></table></div>";
  }

  function renderBlocks(item) {
    var html = "";
    (item.blocks || []).forEach(function (b) {
      if (b.callout !== undefined) {
        html += '<div class="callout ' + (b.callout || "") + '">';
        (b.paragraphs || []).forEach(function (t) { html += "<p>" + t + "</p>"; });
        html += "</div>";
        return;
      }
      html += '<section class="block">';
      if (b.heading) { html += "<h3>" + b.heading + "</h3>"; }
      (b.paragraphs || []).forEach(function (t) { html += "<p>" + t + "</p>"; });
      if (b.bullets) {
        html += "<ul>";
        b.bullets.forEach(function (t) { html += "<li>" + t + "</li>"; });
        html += "</ul>";
      }
      if (b.table) { html += renderTable(b.table); }
      html += "</section>";
    });
    return html;
  }

  /* ---------- tabs and panels ---------- */
  var lastGroup = null;
  ITEMS.forEach(function (item, idx) {
    if (item.group !== lastGroup) {
      var g = document.createElement("div");
      g.className = "tabs-group";
      g.innerHTML = item.group;
      tabsEl.appendChild(g);
      lastGroup = item.group;
    }

    var btn = document.createElement("button");
    btn.className = "tab";
    btn.type = "button";
    btn.setAttribute("role", "tab");
    btn.id = "tab-" + item.id;
    btn.setAttribute("aria-controls", "panel-" + item.id);
    btn.setAttribute("aria-selected", idx === 0 ? "true" : "false");
    btn.tabIndex = idx === 0 ? 0 : -1;
    btn.innerHTML = '<span class="dot"></span><span class="tab-label">' + item.tab + "</span>";
    if (item.urgent) { btn.setAttribute("data-state", "urgent"); }
    tabsEl.appendChild(btn);

    var panel = document.createElement("div");
    panel.className = "panel";
    panel.id = "panel-" + item.id;
    panel.setAttribute("role", "tabpanel");
    panel.setAttribute("aria-labelledby", "tab-" + item.id);
    panel.tabIndex = 0;
    if (idx !== 0) { panel.hidden = true; }

    var html = '<div class="panel-head">' +
      '<div class="panel-label">' + item.label + "</div>" +
      "<h2>" + item.title + "</h2>" +
      '<p class="summary">' + item.summary + "</p></div>";

    html += renderBlocks(item);

    if (hasChoices(item)) {
      html += '<section class="block"><h3>Your call</h3><div class="options">';
      item.options.forEach(function (o) {
        html += '<label class="option"><input type="radio" name="' + item.id + '" value="' +
          o.decision.replace(/"/g, "&quot;") + '"><span class="option-inner">' +
          (o.recommended ? '<span class="option-flag">Recommended</span>' : "") +
          '<span class="option-title">' + o.title + '</span><span class="option-detail">' + o.detail +
          "</span></span></label>";
      });
      html += "</div></section>";
      html += '<section class="block"><h3>Anything you want to add</h3>' +
        '<textarea data-note="' + item.id + '" placeholder="Your own words &mdash; questions, constraints, a different idea entirely."></textarea></section>';
    }

    html += '<div class="navrow"><button class="ghost" data-nav="prev">&larr; Previous</button>' +
      '<span class="spacer"></span><button class="ghost" data-nav="next">Next &rarr;</button></div>';

    panel.innerHTML = html;
    panelsEl.appendChild(panel);
  });

  var tabs = Array.prototype.slice.call(tabsEl.querySelectorAll(".tab"));
  var panels = Array.prototype.slice.call(panelsEl.querySelectorAll(".panel"));

  function select(i) {
    if (i < 0 || i >= tabs.length) { return; }
    tabs.forEach(function (t, j) {
      t.setAttribute("aria-selected", j === i ? "true" : "false");
      t.tabIndex = j === i ? 0 : -1;
      panels[j].hidden = j !== i;
    });
    tabs[i].focus();
    if (window.scrollY > 220) { window.scrollTo({ top: 220, behavior: "smooth" }); }
  }

  tabs.forEach(function (t, i) {
    t.addEventListener("click", function () { select(i); });
    t.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); select((i + 1) % tabs.length); }
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); select((i - 1 + tabs.length) % tabs.length); }
      if (e.key === "Home") { e.preventDefault(); select(0); }
      if (e.key === "End") { e.preventDefault(); select(tabs.length - 1); }
    });
  });

  panelsEl.addEventListener("click", function (e) {
    /* A link carrying data-tab jumps to another tab in this docket, so a rule
       can point at the worked example that follows it. */
    var jump = e.target.closest("a[data-tab]");
    if (jump) {
      e.preventDefault();
      var target = tabs.findIndex(function (t) { return t.id === "tab-" + jump.getAttribute("data-tab"); });
      if (target !== -1) { select(target); }
      return;
    }
    var nav = e.target.closest("[data-nav]");
    if (!nav) { return; }
    var cur = tabs.findIndex(function (t) { return t.getAttribute("aria-selected") === "true"; });
    select(nav.getAttribute("data-nav") === "next" ? Math.min(cur + 1, tabs.length - 1) : Math.max(cur - 1, 0));
  });

  /* ---------- answers ---------- */
  function save() {
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }

  function refresh() {
    var n = 0;
    decidable.forEach(function (item) {
      var done = state[item.id] && state[item.id].choice;
      if (done) { n++; }
      var tab = document.getElementById("tab-" + item.id);
      if (!tab) { return; }
      if (done) { tab.setAttribute("data-state", "done"); }
      else if (item.urgent) { tab.setAttribute("data-state", "urgent"); }
      else { tab.removeAttribute("data-state"); }
    });
    document.getElementById("status").textContent = n + " of " + decidable.length + " decided";
  }

  panelsEl.querySelectorAll('input[type="radio"]').forEach(function (el) {
    var id = el.name;
    if (state[id] && state[id].choice === el.value) { el.checked = true; }
    el.addEventListener("change", function () {
      state[id] = state[id] || {};
      state[id].choice = el.value;
      save();
      refresh();
    });
  });

  panelsEl.querySelectorAll("textarea[data-note]").forEach(function (el) {
    var id = el.getAttribute("data-note");
    if (state[id] && state[id].note) { el.value = state[id].note; }
    el.addEventListener("input", function () {
      state[id] = state[id] || {};
      state[id].note = el.value;
      save();
    });
  });

  function plain(s) {
    /* The copied text is read outside the browser, so entity codes and
       tags are turned back into ordinary characters. */
    var d = document.createElement("div");
    d.innerHTML = s;
    return (d.textContent || "").trim();
  }

  /* The button's own label is captured once, up front. Reading it back at
     click time would capture "Copied" on a rapid second click and restore
     that as the resting label. */
  var copyButton = document.getElementById("copy");
  var copyRestingLabel = copyButton.textContent;
  var copyResetTimer = null;

  copyButton.addEventListener("click", function () {
    var lines = [CONFIG.copyHeading, ""], any = false;
    decidable.forEach(function (item) {
      var s = state[item.id];
      if (!s || (!s.choice && !(s.note || "").trim())) { return; }
      any = true;
      lines.push("**" + plain(item.tab) + "** (" + plain(item.label) + ")");
      if (s.choice) { lines.push("- Decision: " + plain(s.choice)); }
      if ((s.note || "").trim()) { lines.push("- Note: " + s.note.trim()); }
      lines.push("");
    });
    if (!any) { lines.push("_Nothing decided yet._"); }
    var text = lines.join("\n");
    var out = document.getElementById("out");
    out.textContent = text;
    out.classList.remove("hidden");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        copyButton.textContent = "Copied";
        clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(function () {
          copyButton.textContent = copyRestingLabel;
        }, 1600);
      }, function () { /* the text is shown below instead */ });
    }
    out.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  document.getElementById("clear").addEventListener("click", function () {
    state = {};
    try { localStorage.removeItem(CONFIG.storageKey); } catch (e) { /* storage unavailable */ }
    panelsEl.querySelectorAll('input[type="radio"]').forEach(function (r) { r.checked = false; });
    panelsEl.querySelectorAll("textarea[data-note]").forEach(function (t) { t.value = ""; });
    document.getElementById("out").classList.add("hidden");
    refresh();
  });

  refresh();
})();
</script>
