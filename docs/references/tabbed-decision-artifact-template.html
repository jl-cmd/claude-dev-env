<title>Decision docket — tabbed artifact template</title>

<style>
  /* ============================================================
     PALETTE AND TYPE TOKENS
     Every colour below is a token. Components style themselves
     through the tokens, so the three theme blocks are the only
     place a colour is ever written down.
     ============================================================ */
  :root {
    --ink:        #141A1F;
    --ink-soft:   #30383F;
    --ink-faint:  #42484E;
    --paper:      #E8EAE6;
    --surface:    #F5F6F3;
    --rail:       #DEE1DB;
    --rule:       #C7CBC4;
    --rule-soft:  #DBDED8;
    --accent:     #1D4E6B;
    --accent-ink: #14384E;
    --good:       #3D6C48;
    --warn:       #96631C;
    --risk:       #8F3119;
    --good-wash:  #DEE9E0;
    --warn-wash:  #F2E7D1;
    --risk-wash:  #F2DED7;
    --accent-wash:#DAE4EA;
    --calm:       #4A6B80;
    --seam: linear-gradient(90deg, transparent, #C7CBC4 14%, #C7CBC4 86%, transparent);

    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
    --s5: 24px; --s6: 32px; --s7: 44px;
    --measure: 66ch;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DFE4E2; --ink-soft: #B8C0C5; --ink-faint: #A2AAAF;
      --paper: #0F141A; --surface: #181F26; --rail: #141A20;
      --rule: #2D3740; --rule-soft: #222A32;
      --accent: #82B5D1; --accent-ink: #A9CEE3;
      --good: #83B48F; --warn: #D6A863; --risk: #D9866F;
      --good-wash: #1C2A21; --warn-wash: #2B2417; --risk-wash: #2E1E18;
      --accent-wash: #16272F; --calm: #7E97A8;
      --seam: linear-gradient(90deg, transparent, #2D3740 14%, #2D3740 86%, transparent);
    }
  }
  :root[data-theme="dark"] {
    --ink: #DFE4E2; --ink-soft: #B8C0C5; --ink-faint: #A2AAAF;
    --paper: #0F141A; --surface: #181F26; --rail: #141A20;
    --rule: #2D3740; --rule-soft: #222A32;
    --accent: #82B5D1; --accent-ink: #A9CEE3;
    --good: #83B48F; --warn: #D6A863; --risk: #D9866F;
    --good-wash: #1C2A21; --warn-wash: #2B2417; --risk-wash: #2E1E18;
    --accent-wash: #16272F; --calm: #7E97A8;
    --seam: linear-gradient(90deg, transparent, #2D3740 14%, #2D3740 86%, transparent);
  }
  :root[data-theme="light"] {
    --ink: #141A1F; --ink-soft: #30383F; --ink-faint: #42484E;
    --paper: #E8EAE6; --surface: #F5F6F3; --rail: #DEE1DB;
    --rule: #C7CBC4; --rule-soft: #DBDED8;
    --accent: #1D4E6B; --accent-ink: #14384E;
    --good: #3D6C48; --warn: #96631C; --risk: #8F3119;
    --good-wash: #DEE9E0; --warn-wash: #F2E7D1; --risk-wash: #F2DED7;
    --accent-wash: #DAE4EA; --calm: #4A6B80;
    --seam: linear-gradient(90deg, transparent, #C7CBC4 14%, #C7CBC4 86%, transparent);
  }

  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 1180px; margin: 0 auto; padding: var(--s6) var(--s5) var(--s7); }

  /* ---------- masthead ---------- */
  .masthead { display: flex; flex-direction: column; gap: var(--s3); margin-bottom: var(--s5); }
  .topline {
    font-family: var(--sans); font-size: 13.5px; font-weight: 600;
    letter-spacing: 0; text-transform: none; color: var(--accent-ink);
  }
  h1 {
    font-family: var(--serif); font-size: clamp(27px, 4vw, 38px); line-height: 1.1;
    font-weight: 600; letter-spacing: -0.015em; margin: 0; text-wrap: balance;
  }
  .intro {
    font-family: var(--serif); font-size: 17px; color: var(--ink);
    max-width: var(--measure); margin: 0;
  }

  /* The instruction reads as a sequence: a dot per step, a hairline
     between them doing the counting. */
  .stepper { display: flex; align-items: center; flex-wrap: wrap; gap: 0; }
  .step { display: flex; align-items: center; gap: var(--s2); }
  .step span { font-size: 15px; color: var(--ink); }
  .step u {
    text-decoration: none; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); flex: 0 0 8px;
  }
  .step-link { width: 34px; height: 1px; background: var(--calm); margin: 0 var(--s3); }

  /* One-pixel grid gaps over a rule-coloured ground draw the dividers, so
     the row reads as a table without a table's markup. */
  .figures {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    gap: 1px; background: var(--rule); border: 1px solid var(--rule);
    margin-top: var(--s3);
  }
  .figures div {
    display: flex; flex-direction: column;
    background: var(--surface); padding: var(--s3) var(--s4);
  }
  .figures b {
    font-family: var(--serif); font-size: 25px; font-weight: 600;
    line-height: 1.1; font-variant-numeric: tabular-nums;
  }
  /* The denominator rides inside the number at a smaller size, so
     "3 of 8" reads as one value rather than two. */
  .figures b small {
    font-size: 0.55em; font-weight: 500; color: var(--ink-faint);
    margin-left: 2px;
  }
  .figures div[data-tone="good"] b { color: var(--good); }
  .figures div[data-tone="warn"] b { color: var(--warn); }
  .figures div[data-tone="risk"] b { color: var(--risk); }
  .figures span {
    font-family: var(--sans); font-size: 13.5px; font-weight: 500;
    letter-spacing: 0; text-transform: none; color: var(--ink-soft);
  }

  /* ---------- layout ---------- */
  .board {
    display: grid; grid-template-columns: 258px minmax(0, 1fr);
    gap: var(--s5); align-items: start;
  }

  /* ---------- tab rail ---------- */
  .tabs {
    display: flex; flex-direction: column;
    background: var(--rail); border: 1px solid var(--rule-soft);
    max-height: calc(100vh - 190px); overflow-y: auto;
  }

  /* A rail group heading names a section of the docket, so it is set as a
     heading: sentence case, full ink, at the body face. A rule above it
     separates one group from the tabs of the group before. */
  .tabs-group {
    font-family: var(--sans); font-size: 15px; font-weight: 700;
    letter-spacing: -0.003em; text-transform: none; color: var(--ink);
    padding: var(--s3) var(--s3) var(--s2);
    margin-top: var(--s2); position: relative;
  }
  .tabs-group::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
    background: var(--seam);
  }
  .tabs-group:first-child { margin-top: 0; }
  .tabs-group:first-child::before { display: none; }

  .tab {
    display: flex; align-items: center; gap: var(--s2);
    padding: 9px var(--s3); border: 0; background: transparent;
    font-family: var(--sans); font-size: 16px; line-height: 1.35;
    color: var(--ink-soft); text-align: left; width: 100%; cursor: pointer;
    border-left: 3px solid transparent;
    text-transform: none; letter-spacing: normal;
  }
  .tab:hover { background: var(--surface); color: var(--ink); }
  .tab[aria-selected="true"] {
    background: var(--surface); color: var(--ink);
    border-left-color: var(--accent); font-weight: 600;
  }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* The mark carries two readings at once.
     Shape says what you owe: a ring waits for an answer, a filled disc
     holds one, a bar asks for nothing.
     Colour says which kind of attention it wants, on a four-step ramp:
     red today, amber this session, blue worth reading, green settled.
     Background sits on the calm tone, which is the accent hue drained of
     saturation, so a low-priority mark still belongs to the palette.
     Shape repeats what colour says, so the rail reads without colour. */
  .dot {
    width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px;
    border: 2px solid var(--warn); background: transparent;
    margin-top: 5px; align-self: flex-start; box-sizing: border-box;
  }
  .tab[data-state="open-urgent"] .dot,
  .dot[data-legend="open-urgent"] { border-color: var(--risk); }
  .tab[data-state="done"] .dot,
  .dot[data-legend="done"] { border-color: var(--good); background: var(--good); }
  .tab[data-state="reading"] .dot,
  .tab[data-state="reading-urgent"] .dot,
  .dot[data-legend="reading"],
  .dot[data-legend="reading-urgent"] {
    border: 0; border-radius: 1px; height: 3px; margin-top: 8px;
    background: var(--calm);
  }
  .tab[data-state="reading-urgent"] .dot,
  .dot[data-legend="reading-urgent"] { background: var(--accent); }
  .tab-label { flex: 1; }

  /* ---------- rail legend ---------- */
  .rail-column {
    display: flex; flex-direction: column; gap: var(--s3);
    position: sticky; top: var(--s4);
  }
  .legend {
    border: 1px solid var(--rule-soft); background: var(--rail);
    padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2);
  }
  .legend-title {
    font-family: var(--sans); font-size: 13.5px; font-weight: 700;
    letter-spacing: -0.003em; text-transform: none; color: var(--ink);
  }
  .legend-row { display: flex; align-items: flex-start; gap: var(--s2); font-size: 13px; color: var(--ink-soft); }

  /* ---------- panel ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--rule-soft);
    padding: var(--s5) var(--s6) var(--s6);
    display: flex; flex-direction: column; gap: var(--s5);
  }
  .panel[hidden] { display: none; }

  .panel-head { display: flex; flex-direction: column; gap: var(--s2); }
  .panel-label {
    font-family: var(--sans); font-size: 13.5px; font-weight: 600;
    letter-spacing: 0; text-transform: none; color: var(--accent-ink);
  }
  .panel h2 {
    font-family: var(--serif); font-size: clamp(22px, 3vw, 28px); line-height: 1.15;
    font-weight: 600; margin: 0; letter-spacing: -0.012em; text-wrap: balance;
  }
  .summary { font-size: 17px; color: var(--ink-soft); max-width: var(--measure); margin: 0; }

  /* A chip states where the tab stands. Tone picks the semantic colour and
     its wash, so the pill reads at a glance without a legend. */
  .chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .chip {
    display: inline-flex; align-items: center;
    font-family: var(--sans); font-size: 12.5px; font-weight: 600;
    padding: 3px 10px; border-radius: 3px;
    background: var(--accent-wash); color: var(--accent-ink);
    border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .chip.good {
    background: var(--good-wash); color: var(--good);
    border-color: color-mix(in srgb, var(--good) 32%, transparent);
  }
  .chip.warn {
    background: var(--warn-wash); color: var(--warn);
    border-color: color-mix(in srgb, var(--warn) 32%, transparent);
  }
  .chip.risk {
    background: var(--risk-wash); color: var(--risk);
    border-color: color-mix(in srgb, var(--risk) 32%, transparent);
  }

  .block { display: flex; flex-direction: column; gap: var(--s3); }

  /* A section heading inside a tab is a heading, so it is set like one:
     sentence case, full ink, at the body family and a step above body size.
     The mono uppercase treatment stays with the true micro-labels. */
  .block h3 {
    font-family: var(--sans); font-size: 16px; font-weight: 650;
    letter-spacing: -0.006em; text-transform: none;
    color: var(--ink); margin: 0; text-wrap: balance;
  }
  .block p { margin: 0; max-width: var(--measure); }
  .block p + p { margin-top: var(--s2); }
  .block ul { margin: 0; padding-left: 1.25em; max-width: var(--measure); }
  .block li { margin-bottom: var(--s2); padding-left: 2px; }
  .block li::marker { color: var(--calm); }

  /* A name lifted out of prose is tinted, so a path or an identifier is
     found by eye without reading the sentence around it. */
  code {
    font-family: var(--mono); font-size: 0.89em;
    background: var(--accent-wash); color: var(--accent-ink);
    padding: 1px 5px; border-radius: 2px;
  }

  .callout {
    background: var(--accent-wash); border-left: 3px solid var(--accent);
    padding: var(--s3) var(--s4); max-width: var(--measure);
  }
  .callout.risk { background: var(--risk-wash); border-left-color: var(--risk); }
  .callout.warn { background: var(--warn-wash); border-left-color: var(--warn); }
  .callout.good { background: var(--good-wash); border-left-color: var(--good); }
  .callout p { margin: 0; }
  .callout p + p { margin-top: var(--s2); }
  .callout .claim {
    font-family: var(--serif); font-size: 18px; line-height: 1.4;
    color: var(--ink);
  }

  /* A command is quoted exactly, so the reader runs what the tab claims
     was run. It scrolls rather than wrapping, since a wrapped command
     line is a command the reader mistypes. */
  pre {
    margin: 0; overflow-x: auto; background: var(--paper);
    border: 1px solid var(--rule-soft); border-left: 3px solid var(--calm);
    padding: var(--s3) var(--s4); font-family: var(--mono);
    font-size: 13px; line-height: 1.5; color: var(--ink);
  }
  pre code { background: none; color: inherit; padding: 0; }

  table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  caption {
    text-align: left; color: var(--ink-soft); font-size: 13.5px;
    padding-bottom: var(--s2);
  }
  .scroller { overflow-x: auto; border: 1px solid var(--rule-soft); }
  th, td {
    text-align: left; padding: 7px var(--s3);
    border-bottom: 1px solid var(--rule-soft); vertical-align: top;
  }
  /* A column head is named by a rule under it rather than a grey band
     behind it, so the header row belongs to the palette. */
  th {
    font-family: var(--sans); font-size: 13.5px; letter-spacing: 0;
    text-transform: none; color: var(--ink); font-weight: 650;
    background: transparent; white-space: nowrap;
    border-bottom: 2px solid var(--calm);
  }
  th.num, td.num { text-align: right; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }

  /* The underline is a tinted rule of its own, so it sits clear of the
     descenders and firms up on hover rather than appearing from nothing. */
  a {
    color: var(--accent-ink); text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
  }
  a:hover, a:focus-visible { border-bottom-color: var(--accent); }

  /* ---------- the choice control ---------- */
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--s3); }
  .option {
    border: 1px solid var(--rule); background: var(--paper);
    display: flex; flex-direction: column; position: relative;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .option:hover { border-color: var(--accent); }
  .option input {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; width: 100%; height: 100%;
  }
  .option-inner { padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s1); pointer-events: none; }
  .option-flag {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--paper); background: var(--accent);
    align-self: flex-start; padding: 2px 6px; margin-bottom: var(--s1);
  }
  .option-title { font-weight: 600; font-size: 15px; }
  .option-detail { font-size: 13.5px; color: var(--ink-soft); line-height: 1.45; }
  .option input:checked ~ .option-inner { color: var(--ink); }
  .option:has(input:checked) { border-color: var(--accent); border-width: 2px; background: var(--accent-wash); }
  .option:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

  textarea {
    font-family: var(--sans); font-size: 15px; line-height: 1.55; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule);
    padding: var(--s3); width: 100%; min-height: 92px; resize: vertical;
  }
  textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea::placeholder { color: var(--ink-faint); }

  .navrow { display: flex; gap: var(--s2); border-top: 1px solid var(--rule-soft); padding-top: var(--s4); }
  .navrow .spacer { flex: 1; }

  button {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.07em;
    text-transform: uppercase; padding: 9px 16px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--paper);
  }
  button:hover { opacity: 0.87; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.ghost { background: transparent; color: var(--accent-ink); border-color: var(--rule); }
  button:disabled { opacity: 0.4; cursor: default; }

  .dock {
    margin-top: var(--s5); background: var(--surface);
    border: 1px solid var(--rule-soft); border-top: 2px solid var(--ink);
    padding: var(--s3) var(--s5); display: flex; flex-wrap: wrap;
    align-items: center; gap: var(--s4);
  }
  .dock-status { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* The counter gains a bar, so progress is read without arithmetic. */
  .meter { display: flex; flex-direction: column; gap: 5px; min-width: 190px; }
  .meter-track {
    height: 8px; background: var(--paper);
    border: 1px solid var(--rule-soft); overflow: hidden;
  }
  .meter-fill { height: 100%; background: var(--accent); transition: width 180ms ease; }
  .meter-fill[data-full="true"] { background: var(--good); }
  .dock-actions { display: flex; gap: var(--s2); margin-left: auto; }

  .out {
    font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
    background: var(--surface); border: 1px solid var(--rule);
    padding: var(--s4); margin-top: var(--s3); white-space: pre-wrap;
    word-break: break-word; max-height: 320px; overflow-y: auto;
  }
  .hidden { display: none; }

  footer { margin-top: var(--s5); font-size: 13.5px; color: var(--ink-faint); max-width: var(--measure); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 860px) {
    /* minmax(0, 1fr) caps the track at the available width. An auto-sized
       track grows to fit the widest tab and pushes the page sideways. */
    .board { grid-template-columns: minmax(0, 1fr); }
    .rail-column { position: static; }
    .tabs { max-height: none; flex-direction: row; overflow-x: auto; min-width: 0; }
    .tabs-group { display: none; }
    .tab { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; width: auto; }
    .tab[aria-selected="true"] { border-left: 0; border-bottom-color: var(--accent); }
    .stepper { flex-direction: column; align-items: flex-start; gap: var(--s2); }
    .step-link { display: none; }
    .panel { padding: var(--s5) var(--s4); }
    .shell { padding: var(--s5) var(--s4) var(--s6); }
  }
</style>

<div class="shell">
  <header class="masthead" id="masthead"></header>

  <div class="board">
    <div class="rail-column">
      <nav class="tabs" role="tablist" aria-label="Decisions"></nav>
      <div class="legend" id="legend"></div>
    </div>
    <div id="panels"></div>
  </div>

  <div class="dock">
    <div class="meter">
      <span class="dock-status" id="status"></span>
      <div class="meter-track"><div class="meter-fill" id="meter"></div></div>
    </div>
    <div class="dock-actions">
      <button class="ghost" id="clear">Clear all</button>
      <button id="copy">Copy my decisions</button>
    </div>
  </div>
  <div class="out hidden" id="out"></div>

  <footer id="footnote"></footer>
</div>

<script>
/* ================================================================
   SECTION 1 — CONFIG
   Everything above the tabs, plus the page's own wiring.
   ================================================================ */
var CONFIG = {
  /* Small mono line above the headline. Date it, or name the source. */
  topline: "Writing standard &middot; decision docket",

  /* The headline. Say what the reader is being asked for. */
  title: "How to write a docket somebody can answer",

  /* One paragraph telling the reader how the page works. */
  intro: "Each tab states one rule, and follows it.",

  /* A sequence this docket's own work runs in, one step per entry,
     rendered as a stepper under the intro. An empty list hides it.
     Use it only when the tabs have a real order the reader needs --
     a staged rollout, a migration, a dependency chain. Generic page
     instructions belong nowhere: the reader can already see the tabs,
     the choice cards, and the copy button. */
  steps: [],

  /* Headline figures. Use an empty list to hide this row entirely.
     Keep these in step with the tabs: the dock counts only the items
     that carry a choice, so a "decisions on this page" figure that
     disagrees with it is the first thing a reader notices. */
  figures: [
    {value: "3",  unit: " of 8", label: "Tabs asking for a decision"},
    {value: "1",  label: "Decision per tab"},
    {value: "1",  label: "Source per claim", tone: "risk"},
    {value: "20", label: "Words per sentence, max", tone: "warn"}
  ],

  /* Small print under the dock. Say where the numbers came from and
     where the reader's answers live. */
  footnote: "Replace these tabs with your own. Your answers stay in this browser until you press copy.",

  /* Heading on the text the copy button produces. */
  copyHeading: "## My decisions",

  /* Browser storage key. Give each docket its own, so two dockets
     open in the same browser never overwrite each other. */
  storageKey: "decision-docket-standard-v1"
};

/* ================================================================
   SECTION 2 — CONTENT
   One entry per tab, in the order the reader should meet them.

   ITEM FIELDS
     id          Short slug. Must be unique. Used for storage and anchors.
     group       Rail heading. Consecutive items sharing a group sit under
                 one heading. Suggested set:
                   "Read this first"  — context the rest depends on
                   "Only you can answer" — genuine judgement calls
                   "Ready when you say go" — decided in principle, awaiting a yes
                   "Reference" — background, no decision

    var numeric = t.head.map(function (h, col) {

    var html = '<div class="panel-head">' +
      '<div class="panel-label">' + item.label + "</div>" +
      "<h2>" + item.title + "</h2>" +
      '<p class="summary">' + item.summary + "</p>";
    if ((item.chips || []).length) {
      html += '<div class="chips">';
      item.chips.forEach(function (chip) {
        html += '<span class="chip ' + (chip.tone || "") + '">' + chip.text + "</span>";
      });
      html += "</div>";
    }
    html += "</div>";

    html += renderBlocks(item);

    if (hasChoices(item)) {
      html += '<section class="block"><h3>Your call</h3><div class="options">';
      item.options.forEach(function (o) {
        html += '<label class="option"><input type="radio" name="' + item.id + '" value="' +
          o.decision.replace(/"/g, "&quot;") + '"><span class="option-inner">' +
          (o.recommended ? '<span class="option-flag">Recommended</span>' : "") +
          '<span class="option-title">' + o.title + '</span><span class="option-detail">' + o.detail +
          "</span></span></label>";
      });
      html += "</div></section>";
      html += '<section class="block"><h3>Anything you want to add</h3>' +
        '<textarea data-note="' + item.id + '" placeholder="Your own words &mdash; questions, constraints, a different idea entirely."></textarea></section>';
    }

    html += '<div class="navrow"><button class="ghost" data-nav="prev">&larr; Previous</button>' +
      '<span class="spacer"></span><button class="ghost" data-nav="next">Next &rarr;</button></div>';

    panel.innerHTML = html;
    panelsEl.appendChild(panel);
  });

  var tabs = Array.prototype.slice.call(tabsEl.querySelectorAll(".tab"));
  var panels = Array.prototype.slice.call(panelsEl.querySelectorAll(".panel"));

  function select(i) {
    if (i < 0 || i >= tabs.length) { return; }
    tabs.forEach(function (t, j) {
      t.setAttribute("aria-selected", j === i ? "true" : "false");
      t.tabIndex = j === i ? 0 : -1;
      panels[j].hidden = j !== i;
    });
    tabs[i].focus();
    if (window.scrollY > 220) { window.scrollTo({ top: 220, behavior: "smooth" }); }
  }

  tabs.forEach(function (t, i) {
    t.addEventListener("click", function () { select(i); });
    t.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); select((i + 1) % tabs.length); }
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); select((i - 1 + tabs.length) % tabs.length); }
      if (e.key === "Home") { e.preventDefault(); select(0); }
      if (e.key === "End") { e.preventDefault(); select(tabs.length - 1); }
    });
  });

  panelsEl.addEventListener("click", function (e) {
    /* A link carrying data-tab jumps to another tab in this docket, so a rule
       can point at the worked example that follows it. */
    var jump = e.target.closest("a[data-tab]");
    if (jump) {
      e.preventDefault();
      var target = tabs.findIndex(function (t) { return t.id === "tab-" + jump.getAttribute("data-tab"); });
      if (target !== -1) { select(target); }
      return;
    }
    var nav = e.target.closest("[data-nav]");
    if (!nav) { return; }
    var cur = tabs.findIndex(function (t) { return t.getAttribute("aria-selected") === "true"; });
    select(nav.getAttribute("data-nav") === "next" ? Math.min(cur + 1, tabs.length - 1) : Math.max(cur - 1, 0));
  });

  /* ---------- answers ---------- */
  function save() {
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }

  function refresh() {
    var n = 0;
    ITEMS.forEach(function (item) {
      var isAnswered = !!(state[item.id] && state[item.id].choice) && hasChoices(item);
      if (isAnswered) { n++; }
      var tab = document.getElementById("tab-" + item.id);
      if (!tab) { return; }
      var mark = markFor(item, isAnswered);
      if (mark) { tab.setAttribute("data-state", mark); }
      else { tab.removeAttribute("data-state"); }
    });
    document.getElementById("status").textContent = n + " of " + decidable.length + " decided";
    var meter = document.getElementById("meter");
    var share = decidable.length ? Math.round((n / decidable.length) * 100) : 0;
    meter.style.width = share + "%";
    meter.setAttribute("data-full", String(n > 0 && n === decidable.length));
  }

  panelsEl.querySelectorAll('input[type="radio"]').forEach(function (el) {
    var id = el.name;
    if (state[id] && state[id].choice === el.value) { el.checked = true; }
    el.addEventListener("change", function () {
      state[id] = state[id] || {};
      state[id].choice = el.value;
      save();
      refresh();
    });
  });

  panelsEl.querySelectorAll("textarea[data-note]").forEach(function (el) {
    var id = el.getAttribute("data-note");
    if (state[id] && state[id].note) { el.value = state[id].note; }
    el.addEventListener("input", function () {
      state[id] = state[id] || {};
      state[id].note = el.value;
      save();
    });
  });

  function plain(s) {
    /* The copied text is read outside the browser, so entity codes and
       tags are turned back into ordinary characters. */
    var d = document.createElement("div");
    d.innerHTML = s;
    return (d.textContent || "").trim();
  }

  /* The button's own label is captured once, up front. Reading it back at
     click time would capture "Copied" on a rapid second click and restore
     that as the resting label. */
  var copyButton = document.getElementById("copy");
  var copyRestingLabel = copyButton.textContent;
  var copyResetTimer = null;

  copyButton.addEventListener("click", function () {
    var lines = [CONFIG.copyHeading, ""], any = false;
    decidable.forEach(function (item) {
      var s = state[item.id];
      if (!s || (!s.choice && !(s.note || "").trim())) { return; }
      any = true;
      lines.push("**" + plain(item.tab) + "** (" + plain(item.label) + ")");
      if (s.choice) { lines.push("- Decision: " + plain(s.choice)); }
      if ((s.note || "").trim()) { lines.push("- Note: " + s.note.trim()); }
      lines.push("");
    });
    if (!any) { lines.push("_Nothing decided yet._"); }
    var text = lines.join("\n");
    var out = document.getElementById("out");
    out.textContent = text;
    out.classList.remove("hidden");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        copyButton.textContent = "Copied";
        clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(function () {
          copyButton.textContent = copyRestingLabel;
        }, 1600);
      }, function () { /* the text is shown below instead */ });
    }
    out.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  document.getElementById("clear").addEventListener("click", function () {
    state = {};
    try { localStorage.removeItem(CONFIG.storageKey); } catch (e) { /* storage unavailable */ }
    panelsEl.querySelectorAll('input[type="radio"]').forEach(function (r) { r.checked = false; });
    panelsEl.querySelectorAll("textarea[data-note]").forEach(function (t) { t.value = ""; });
    document.getElementById("out").classList.add("hidden");
    refresh();
  });

  refresh();
})();
</script>
