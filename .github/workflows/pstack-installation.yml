name: Pstack installation
on:
  pull_request:
    paths:
      - 'packages/claude-dev-env/bin/pstack*'
      - 'packages/claude-dev-env/.agents/skills/session-continuity/**'
      - 'packages/claude-dev-env/scripts/pstack*'
      - 'packages/claude-dev-env/scripts/pstack-adapters/**'
      - 'packages/claude-dev-env/bin/install-session-continuity*'
      - 'packages/claude-dev-env/rules/pstack*'
      - 'packages/claude-dev-env/package.json'
      - '.github/workflows/pstack-installation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test install and rollback behavior
        shell: bash
        run: node --test --test-reporter=tap packages/claude-dev-env/bin/pstack.test.mjs packages/claude-dev-env/bin/install-session-continuity.test.mjs packages/claude-dev-env/.agents/skills/session-continuity/continuity.test.mjs | tee "$RUNNER_TEMP/pstack-tests.tap"
      - name: Install the pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          node packages/claude-dev-env/bin/pstack.mjs install --root "$RUNNER_TEMP/pstack-proof/.claude" --strict > "$RUNNER_TEMP/pstack-install.json"
          node packages/claude-dev-env/bin/pstack.mjs verify --root "$RUNNER_TEMP/pstack-proof/.claude" > "$RUNNER_TEMP/pstack-verify.json"
          node packages/claude-dev-env/bin/pstack.mjs install --root "$RUNNER_TEMP/pstack-proof/.claude" --offline --strict
      - name: Verify native Codex skill discovery
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pstack-codex" @openai/codex@0.153.4
          export CDE_CODEX_EXECUTABLE="$RUNNER_TEMP/pstack-codex/node_modules/.bin/codex"
          export CDE_PSTACK_PROOF_PROJECT="$RUNNER_TEMP/pstack-proof"
          export CDE_PSTACK_DISCOVERY_REPORT="$RUNNER_TEMP/pstack-codex-discovery.json"
          node --test packages/claude-dev-env/bin/pstack-codex-discovery.test.mjs
      - name: Archive the tested source
        if: always()
        shell: bash
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/pstack-tested-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/pstack-source-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pstack-evidence-${{ runner.os }}
          path: |
            ${{ runner.temp }}/pstack-codex-discovery.json
            ${{ runner.temp }}/pstack-tests.tap
            ${{ runner.temp }}/pstack-install.json
            ${{ runner.temp }}/pstack-verify.json
            ${{ runner.temp }}/pstack-tested-source.zip
            ${{ runner.temp }}/pstack-source-sha.txt
