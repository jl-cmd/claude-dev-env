name: Prepare skill-link cleanup
on:
  push:
    branches: [fix/retired-skill-install-links]
    paths: [.github/workflows/retired-skill-cleanup-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: c3702fec480fad2c14a82af128578b0a19966afb
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Place tests beside the installer
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          expected = {
              'packages/claude-dev-env/bin/install.test.mjs': 'cb9329c2fd4253db1db918798b33b8662c3bdf99',
              'packages/claude-dev-env/bin/install.skill-selection.test.mjs': '3b1472a89631e16a65bcd193f12dd7edf2a0af3a',
              'tests/test_eli5_skill.py': '79c671b5bc4a19178649688374dfa052b61efdbb',
          }
          for name, expected_sha in expected.items():
              data = Path(name).read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == expected_sha, name
          source = Path('packages/claude-dev-env/bin/install.skill-selection.test.mjs')
          target = Path('packages/claude-dev-env/bin/install.test.mjs')
          text = source.read_text()
          text = text[text.index('const RETIRED_SKILLS'):]
          text = text.replace("    const skillsRoot = resolvePackageManagedDirectory(PACKAGE_ROOT, 'skills');\n", '')
          text = text.replace("existsSync(join(skillsRoot, skillName, 'SKILL.md'))", "existsSync(new URL(`../.agents/skills/${skillName}/SKILL.md`, import.meta.url))")
          target.write_text(target.read_text() + '\n' + text)
          source.unlink()
          path = Path('tests/test_eli5_skill.py')
          text = path.read_text()
          before = 'assert "### Skills (27)" in readme_text'
          assert text.count(before) == 1
          path.write_text(text.replace(before, 'assert "### Skills" in readme_text.splitlines()'))
      - name: Test changed install checks
        run: |
          node --test --test-name-pattern='each core skill|retired skills leave|README and vault' packages/claude-dev-env/bin/install.test.mjs
          node --test packages/claude-dev-env/bin/install.codex-rules.test.mjs packages/claude-dev-env/bin/install.cursor-rules.test.mjs packages/claude-dev-env/bin/install.transaction.test.mjs
          python -m pip install pytest
          python -m pytest tests/test_eli5_skill.py -q
      - name: Store checked Git objects
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          names = ['packages/claude-dev-env/bin/install.test.mjs', 'tests/test_eli5_skill.py']
          deleted = 'packages/claude-dev-env/bin/install.skill-selection.test.mjs'
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == set(names + [deleted])
          subprocess.run(['git', 'diff', '--check'], check=True)

          def post(resource, payload):
              request = urllib.request.Request('https://api.github.com/repos/jl-cmd/claude-dev-env/git/' + resource, data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          entries = [{'path': deleted, 'mode': '100644', 'type': 'blob', 'sha': None}]
          for name in names:
              data = Path(name).read_bytes()
              blob = post('blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = post('trees', {'base_tree': '704265f8a1f555449c2a31ba31e94ab5f2699bb1', 'tree': entries})
          print('CHECKED_CLEANUP_TREE=' + tree['sha'])
          print(json.dumps(entries, indent=2))
