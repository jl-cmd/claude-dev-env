# Label set for this repository, one entry per label.
#
# `sync-labels.yml` applies this file to the repository's labels. A label is
# matched by `name`; its colour and description are set from the entry here.
# A label the repository carries that is missing from this file is left alone.
#
# Five axes carry one label each per item — priority, type, status, size, and
# area — plus standalone flags. Keep the names byte for byte: the sync matches
# on the exact string, so a renamed entry creates a second label and leaves the
# original untouched.

# Priority: how soon the work matters.
- name: "P0"
  color: "b60205"
  description: "Broken, blocking, or losing data right now"
- name: "P1"
  color: "d93f0b"
  description: "Important and due soon; blocks planned work"
- name: "P2"
  color: "fbca04"
  description: "Normal backlog work"
- name: "P3"
  color: "c2e0c6"
  description: "Nice to have, cosmetic, or deferred"

# Type: what kind of change this is.
- name: "type: bug"
  color: "d73a4a"
  description: "Sub-issue: a defect to fix"
- name: "type: feature"
  color: "a2eeef"
  description: "A new capability or an improvement"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: refactor"
  color: "5319e7"
  description: "Restructuring with no change in behaviour"
- name: "type: test"
  color: "bfd4f2"
  description: "Test coverage"
- name: "type: ci"
  color: "1d76db"
  description: "CI, workflow, or release plumbing"
- name: "type: chore"
  color: "cfd3d7"
  description: "Housekeeping and dependency bumps"
- name: "type: perf"
  color: "0e8a16"
  description: "Speed or resource use"

# Status: where the item sits in the flow. Pull requests use the first five;
# issues use the last three.
- name: "status: draft"
  color: "ededed"
  description: "Pull request is still a draft"
- name: "status: needs-review"
  color: "0e8a16"
  description: "Ready for a reviewer to pick up"
- name: "status: changes-requested"
  color: "e99695"
  description: "A reviewer asked for changes"
- name: "status: needs-rebase"
  color: "e99695"
  description: "Behind its base branch or in conflict"
- name: "status: ready-to-merge"
  color: "0e8a16"
  description: "Approved and green; waiting on merge"
- name: "status: backlog"
  color: "ededed"
  description: "Open issue, not started"
- name: "status: in-progress"
  color: "fbca04"
  description: "Someone is working on it"
- name: "status: blocked"
  color: "b60205"
  description: "Waiting on something else to land"

# Size: how much work the item carries. On a pull request this comes from the
# changed-line count; on an issue it comes from the number of distinct pieces
# of work the body asks for.
- name: "size: XS"
  color: "c2e0c6"
  description: "Up to 20 changed lines, or one piece of work"
- name: "size: S"
  color: "c2e0c6"
  description: "21 to 100 changed lines, or two to three pieces"
- name: "size: M"
  color: "fef2c0"
  description: "101 to 500 changed lines, or four to eight pieces"
- name: "size: L"
  color: "f9d0c4"
  description: "501 to 1000 changed lines, or nine to fifteen pieces"
- name: "size: XL"
  color: "e99695"
  description: "Over 1000 changed lines, or a parent with sub-issues"

# Area: which part of the tree the work touches. An item may carry up to three.
- name: "area: hooks"
  color: "1d76db"
  description: "packages/claude-dev-env/hooks/"
- name: "area: skills"
  color: "1d76db"
  description: "packages/claude-dev-env/.agents/skills/"
- name: "area: agents"
  color: "1d76db"
  description: "packages/claude-dev-env/.agents/agents/"
- name: "area: commands"
  color: "1d76db"
  description: "packages/claude-dev-env/commands/"
- name: "area: rules"
  color: "1d76db"
  description: "packages/claude-dev-env/rules/"
- name: "area: installer"
  color: "1d76db"
  description: "packages/claude-dev-env/bin/ and package manifests"
- name: "area: ci"
  color: "1d76db"
  description: ".github/workflows/ and .github/ci/"
- name: "area: tests"
  color: "1d76db"
  description: "Test suites and test files"
- name: "area: scripts"
  color: "1d76db"
  description: "Helper scripts under scripts/ and _shared/"
- name: "area: docs"
  color: "1d76db"
  description: "Markdown files and docs/ directories"

# Flags: standalone, outside the five axes. An item may carry any number.
# The colour and wording of a flag already in use on this repository come from
# the label as it stands there.
- name: "stacked"
  color: "d4c5f9"
  description: "Targets another pull request's branch, not main"
- name: "epic"
  color: "6f42c1"
  description: "Parent issue tracking a stream of child PRs"
- name: "child"
  color: "0e8a16"
  description: "Bite-sized issue scoped to one small PR"
- name: "file-split"
  color: "5319e7"
  description: "Split an over-400-line file into clean sub-cap modules"
- name: "critical"
  color: "b60205"
  description: "Must-do follow-up"
- name: "tech-debt"
  color: "ededed"
  description: "Tech debt"
- name: "logging"
  color: "bfdadc"
  description: "Logging and host observability"
- name: "QoL"
  color: "0e8a16"
  description: "Quality-of-life"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "ai-rules-drift"
  color: "ededed"
  description: ""
- name: "autorelease: pending"
  color: "ededed"
  description: ""
- name: "redirect"
  color: "ededed"
  description: "Points the author at the right place to ask"
- name: "prompt-generator"
  color: "ededed"
  description: "Concerns the prompt-generator workflow"
