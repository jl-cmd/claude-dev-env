name: Set up oxipng
description: Install the pinned oxipng release binary, check its SHA-256 digest, and put it on PATH.

runs:
  using: composite
  steps:
    - name: Install oxipng on Linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        OXIPNG_ADDRESS: https://github.com/oxipng/oxipng/releases/download/v10.2.1/oxipng-10.2.1-x86_64-unknown-linux-musl.tar.gz
        OXIPNG_SHA256: 1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17
      run: |
        set -euo pipefail
        install_directory="$RUNNER_TEMP/oxipng"
        mkdir -p "$install_directory"
        curl -sSfL "$OXIPNG_ADDRESS" -o "$install_directory/oxipng.tar.gz"
        echo "$OXIPNG_SHA256  $install_directory/oxipng.tar.gz" | sha256sum -c -
        tar -xzf "$install_directory/oxipng.tar.gz" -C "$install_directory" --strip-components=1
        echo "$install_directory" >> "$GITHUB_PATH"

    - name: Install oxipng on Windows
      if: runner.os == 'Windows'
      shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
      env:
        OXIPNG_ADDRESS: https://github.com/oxipng/oxipng/releases/download/v10.2.1/oxipng-10.2.1-x86_64-pc-windows-msvc.zip
        OXIPNG_SHA256: 7e940f83ee46874b73f53031f96a15834cb70b220af27391fb06fe7b4dd798e1
      run: |
        $installDirectory = Join-Path $env:RUNNER_TEMP "oxipng"
        New-Item -ItemType Directory -Force -Path $installDirectory | Out-Null
        $archivePath = Join-Path $installDirectory "oxipng.zip"
        Invoke-WebRequest -Uri $env:OXIPNG_ADDRESS -OutFile $archivePath -UseBasicParsing
        $archiveDigest = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLower()
        if ($archiveDigest -ne $env:OXIPNG_SHA256) {
          Write-Output "The oxipng archive digest $archiveDigest does not match the pinned digest."
          exit 1
        }
        Expand-Archive -LiteralPath $archivePath -DestinationPath $installDirectory -Force
        $binaryDirectory = Join-Path $installDirectory "oxipng-10.2.1-x86_64-pc-windows-msvc"
        $binaryDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
