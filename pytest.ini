[pytest]
addopts = --import-mode=importlib
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_* should_*
pythonpath = .
# Collect tests under packages/claude-dev-env/.agents (the canonical skill
# and agent source). Skip other hidden trees, including .claude so the
# lookup pointers are not collected as a second copy.
norecursedirs = *.egg _darcs build CVS dist node_modules venv .git .hg .tox .venv __pycache__ .pytest_cache .mypy_cache .ruff_cache .claude .cursor
# Local/CI parallel: pip install pytest-xdist (or pip install -e "packages/claude-dev-env[dev]"),
# then python -m pytest <suite> -n auto. Keep root tests/ and packages/claude-dev-env as separate sessions.
